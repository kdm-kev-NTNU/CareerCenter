name: Setup Node app
description: Install lockfile dependencies, generate the Prisma client, and build the shared package.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run db:generate --workspace=@careercenter/api
    - shell: bash
      run: npm run build --workspace=@careercenter/shared
