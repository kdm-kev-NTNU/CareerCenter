# CI
# Tiers:
# - pull_request and every branch push: quality and unit run in parallel.
#   Local parity: npm run test:ci
# - push to main, and workflow_dispatch: Cypress coverage gate (e2e).
#   Local parity: npm run test:ci:full
# - push to main: production image build, in parallel with e2e after the fast gate.
# A newer push to the same ref cancels the run that is still going.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
      - run: npm run typecheck
      - run: npm run lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
      - run: npm run test:scripts
      - run: npm run test:coverage
      - run: npm run coverage:merge:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 1

  e2e:
    name: e2e
    needs: unit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
      - run: npx cypress install
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
      - run: npm run test:e2e
      - run: npm run coverage:merge:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-full
          path: |
            coverage/
            !coverage/**/coverage-unit-final.json
          retention-days: 7

  docker:
    name: docker
    needs: [quality, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f frontend/Dockerfile -t careercenter-frontend .
      - run: docker build -f backend/Dockerfile -t careercenter-backend .
